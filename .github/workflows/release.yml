name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag and project version
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Build and package
        shell: zsh {0}
        run: |
          chmod +x scripts/*.sh src/*.zsh
          ./scripts/privacy-check.sh
          ./scripts/package.sh
          ./scripts/privacy-check.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/DSH-Launcher-macOS-universal-v*.zip \
            dist/SHA256SUMS \
            --generate-notes \
            --title "DSH Launcher ${GITHUB_REF_NAME}"
